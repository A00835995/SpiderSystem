name: 🚀 Deploy SpiderSystem to SAP BTP Cloud Foundry
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v3

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: ☁️ Install Cloud Foundry CLI v8
        run: |
            wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | \
              sudo gpg --dearmor -o /usr/share/keyrings/cli.cloudfoundry.org.gpg
            echo "deb [signed-by=/usr/share/keyrings/cli.cloudfoundry.org.gpg] https://packages.cloudfoundry.org/debian stable main" | \
              sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
            sudo apt-get update
            sudo apt-get install -y cf8-cli || sudo apt-get install -y cf-cli
            cf version
        

      - name: 🔐 Authenticate to SAP BTP CF
        env:
          CF_API: ${{ secrets.CF_API }}
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
          CF_ORG: ${{ secrets.CF_ORG }}
          CF_SPACE: ${{ secrets.CF_SPACE }}
        run: |
          cf api "$CF_API"
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o "$CF_ORG" -s "$CF_SPACE"

      - name: 🚀 Deploy Backend (spidersap-backend)
        working-directory: Back
        run: |
          npm install --omit=dev
          cf create-route $CF_SPACE cfapps.us10-001.hana.ondemand.com --hostname spidersap-backend || echo "Route already exists"
          cf push spidersap-backend
          cf logs spidersap-backend --recent
          cf set-env spidersap-backend HANA_SERVER_NODE "${{ secrets.HANA_SERVER_NODE }}"
          cf set-env spidersap-backend HANA_USER "${{ secrets.HANA_USER }}"
          cf set-env spidersap-backend HANA_PASSWORD "${{ secrets.HANA_PASSWORD }}"
          cf set-env spidersap-backend HANA_SCHEMA "${{ secrets.HANA_SCHEMA }}"
          cf set-env spidersap-backend JWT_SECRET "${{ secrets.JWT_SECRET }}"
          cf set-env spidersap-backend CORS_ALLOWED_ORIGINS "${{ secrets.CORS_ALLOWED_ORIGINS }}"
          cf restage spidersap-backend

      - name: 🌐 Get Backend Route
        id: backend-url
        run: |
          BACKEND_ROUTE=$(cf app spidersap-backend | grep routes: | awk '{print $2}')
          echo "BACKEND_URL=https://$BACKEND_ROUTE/api" >> $GITHUB_ENV
          echo "✅ Backend URL: https://$BACKEND_ROUTE/api"

      - name: 🏗️ Build Frontend (spidersap-frontend)
        working-directory: Front2
        run: |
          echo "VITE_API_URL=${{ env.BACKEND_URL }}" > .env.production
          npm install
          npm run build
          echo "root: ." > build/Staticfile

      - name: 🚫 Remove manifest.yml to avoid CF conflict
        working-directory: Front2
        run: rm -f manifest.yml

      - name: 📁 Check build output
        working-directory: Front2
        run: |
            echo "Verificando contenido de la carpeta build:"
            ls -la build
        

      - name: 🌍 Deploy Frontend (spidersap-frontend)
        run: |
          cf push spidersap-frontend \
            --random-route \
            -p Front2/build \
            -m 128M \
            -b https://github.com/cloudfoundry/staticfile-buildpack.git
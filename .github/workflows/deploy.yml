name: 🚀 Deploy SpiderSystem to SAP BTP Cloud Foundry
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Required for SonarQube to analyze entire history

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: ☁️ Install Cloud Foundry CLI v8
        run: |
            wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | \
              sudo gpg --dearmor -o /usr/share/keyrings/cli.cloudfoundry.org.gpg
            echo "deb [signed-by=/usr/share/keyrings/cli.cloudfoundry.org.gpg] https://packages.cloudfoundry.org/debian stable main" | \
              sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
            sudo apt-get update
            sudo apt-get install -y cf8-cli || sudo apt-get install -y cf-cli
            cf version

      - name: 🧪 Backend testing and linting
        working-directory: Back
        run: |
          npm install
          npm run lint || echo "Lint step skipped - No lint script found"
          npm test --coverage || echo "Test step skipped - No test script found"

      - name: 🔍 SonarQube Scan (Backend)
        working-directory: Back
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_BACKEND }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BACKEND }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY_BACKEND }}
        run: |
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip -q sonar-scanner.zip
          export PATH="$PATH:$PWD/sonar-scanner-5.0.1.3006-linux/bin"
          sonar-scanner \
            -Dsonar.projectKey=$SONAR_PROJECT_KEY \
            -Dsonar.sources=. \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.exclusions=**/__tests__/**,**/*.test.js,**/node_modules/**,**/coverage/lcov-report/**/*.html,**/Faker/**,**/HANAML/** \
            -Dsonar.tests=__tests__ \
            -Dsonar.test.inclusions=**/__tests__/**/*.test.js \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.coverage.exclusions=**/coverage/lcov-report/**/*.html,**/Faker/**,**/HANAML/**

      - name: 🔐 Authenticate to SAP BTP CF
        env:
          CF_API: ${{ secrets.CF_API }}
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
          CF_ORG: ${{ secrets.CF_ORG }}
          CF_SPACE: ${{ secrets.CF_SPACE }}
        run: |
          cf api "$CF_API"
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o "$CF_ORG" -s "$CF_SPACE"

      - name: 🚀 Deploy Backend (spidersap-backend)
        working-directory: Back
        run: |
          npm install --omit=dev
          cf create-route $CF_SPACE cfapps.us10-001.hana.ondemand.com --hostname spidersap-backend || echo "Route already exists"
          cf push spidersap-backend
          cf logs spidersap-backend --recent
          cf set-env spidersap-backend HANA_SERVER_NODE "${{ secrets.HANA_SERVER_NODE }}"
          cf set-env spidersap-backend HANA_USER "${{ secrets.HANA_USER }}"
          cf set-env spidersap-backend HANA_PASSWORD "${{ secrets.HANA_PASSWORD }}"
          cf set-env spidersap-backend HANA_SCHEMA "${{ secrets.HANA_SCHEMA }}"
          cf set-env spidersap-backend JWT_SECRET "${{ secrets.JWT_SECRET }}"
          cf set-env spidersap-backend CORS_ALLOWED_ORIGINS "${{ secrets.CORS_ALLOWED_ORIGINS }}"
          cf restage spidersap-backend

      - name: 🌐 Get Backend Route
        id: backend-url
        run: |
          BACKEND_ROUTE=$(cf app spidersap-backend | grep routes: | awk '{print $2}')
          echo "BACKEND_URL=https://$BACKEND_ROUTE/api" >> $GITHUB_ENV
          echo "✅ Backend URL: https://$BACKEND_ROUTE/api"

      - name: 🔎 Test backend health endpoint
        run: |
          echo "⏳ Waiting 15s for backend to boot..."
          sleep 15
          curl --fail "${{ env.BACKEND_URL }}/login" || {
            echo "❌ Backend health check failed."
            exit 1
          }

      - name: 🧪 Frontend testing and linting
        working-directory: Front2
        run: |
          npm install
          npm run lint || echo "Lint step skipped - No lint script found"
          npm test --coverage || echo "Test step skipped - No test script found"

      - name: 🔍 SonarQube Scan (Frontend)
        working-directory: Front2
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_FRONTEND }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY_FRONTEND }}
        run: |
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip -q sonar-scanner.zip
          export PATH="$PATH:$PWD/sonar-scanner-5.0.1.3006-linux/bin"
          sonar-scanner \
            -Dsonar.projectKey=$SONAR_PROJECT_KEY \
            -Dsonar.sources=src \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.exclusions=**/__tests__/**,**/*.test.jsx,**/*.test.js,**/node_modules/**,**/coverage/**,**/build/**,**/Faker/**,**/HANAML/** \
            -Dsonar.tests=src \
            -Dsonar.test.inclusions=src/**/__tests__/**/*.test.jsx,src/**/__tests__/**/*.test.js \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.testExecutionReportPaths=coverage/test-report.xml \
            -Dsonar.javascript.file.suffixes=js,jsx \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.verbose=true \
            -Dsonar.coverage.exclusions=**/coverage/lcov-report/**/*.html,**/Faker/**,**/HANAML/**,**/__tests__/**,**/*.test.jsx,**/*.test.js

      - name: 🏗️ Build Frontend (spidersap-frontend)
        working-directory: Front2
        run: |
          echo "VITE_API_URL=${{ env.BACKEND_URL }}" > .env.production
          npm install
          npm run build
          echo "root: ." > build/Staticfile
          echo "pushstate: enabled" >> build/Staticfile

      - name: 📁 Check build output
        working-directory: Front2
        run: |
            echo "Verificando contenido de la carpeta build:"
            ls -la build

      - name: 🌍 Deploy Frontend (spidersap-frontend)
        working-directory: Front2
        run: cf push spidersap-frontend